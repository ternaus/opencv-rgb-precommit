minimum_pre_commit_version: "4.6.0"

repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: mypy
        name: mypy
        entry: uv run --locked --group dev mypy
        language: system
        pass_filenames: false
        files: ^(src|tests)/.*\.py$
      - id: pyrefly-check
        name: Pyrefly type check
        entry: uv run --locked --group dev pyrefly check
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
      - id: check-opencv-rgb-self
        name: Check this repository's OpenCV RGB policy
        entry: uv run --locked --group dev python -m opencv_rgb_policy.cli
        language: system
        types: [python]
  - repo: https://github.com/ternaus/ruff-policy-hooks
    rev: v0.4.0
    hooks:
      - id: check-ruff-suppressions
        name: Protect mandatory Ruff complexity diagnostics
        args: [--protect=C901,PLR0911,PLR0912,PLR0913,PLR0915,PLR0917]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2500"]
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: debug-statements
      - id: detect-private-key
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        exclude: __pycache__/
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-mock-methods
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char
  - repo: https://github.com/Ternaus/numpy-assert-lint
    rev: v0.2.0
    hooks:
      - id: numpy-assert-lint
        files: ^tests/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: ["tomli>=2.4.1"]
